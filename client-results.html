<style>
  :root{
    --navy: #0a1044;
    --navy-2: #0d2547;
    --navy-deep: #002342;
    --rust: #a05a2a;
    --rust-dark: #7c3d14;
    --cream: #f6f5f3;
    --ink: #1c2b57;
    --ink-soft: #5b6b85;
    --line: #e6e2da;
    --label-bar: #070d12;
    --white: #ffffff;
  }

  *{box-sizing:border-box;}

  html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

  body{
    margin:0;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--ink);
    background:var(--white);
    line-height:1.55;
    overflow-x:hidden;
  }

  h1,h2,h3,.serif{
    font-family:'Playfair Display', Georgia, serif;
    color:var(--navy);
    margin:0;
    font-weight:700;
    line-height:1.12;
  }

  .script{
    font-family:'Caveat',cursive;
  }

  a{
    color:inherit;
  }

  img{
    max-width:100%;
    display:block;
  }

  .wrap{
    max-width:1240px;
    margin:0 auto;
    padding:0 40px;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--rust);
    color:var(--white);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:0.95rem;
    padding:14px 26px;
    border-radius:6px;
    text-decoration:none;
    border:1px solid var(--rust);
    transition:background .2s ease;
    white-space:nowrap;
  }

  .btn:hover{
    background:var(--rust-dark);
    border-color:var(--rust-dark);
  }

  .btn-outline{
    background:transparent;
    color:var(--navy);
    border:1px solid var(--navy);
  }

  .btn-outline:hover{
    background:var(--navy);
    color:var(--white);
  }

  /* HEADER */

  header{
    position:sticky;
    top:0;
    z-index:50;
    background:#fff;
    border-bottom:1px solid var(--line);
  }

  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 0;
    gap:16px;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    flex:none;
  }

  .logo-mark{
    font-family:'Playfair Display',serif;
    font-size:clamp(1.35rem,3vw,1.7rem);
    font-weight:700;
    color:var(--navy);
  }

  .logo-mark span{
    color:var(--rust);
  }

  .logo-text{
    line-height:1.2;
  }

  .logo-text strong{
    display:block;
    font-size:0.78rem;
    color:var(--navy);
    font-weight:800;
    letter-spacing:.01em;
  }

  .logo-text small{
    display:block;
    font-size:0.6rem;
    color:var(--ink-soft);
    letter-spacing:.05em;
    font-weight:600;
  }

  @media(max-width:420px){
    .logo-text{
      display:none;
    }
  }

  nav.primary{
    display:flex;
    align-items:center;
    gap:22px;
  }

  nav.primary a{
    font-size:0.85rem;
    font-weight:500;
    text-decoration:none;
    color:var(--navy);
    padding-bottom:5px;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }

  nav.primary a:hover,
  nav.primary a.active{
    border-color:var(--rust);
    color:var(--rust);
  }

  .nav-cta{
    flex:none;
    padding:11px 18px;
    font-size:0.86rem;
  }

  .menu-toggle{
    display:none;
    flex:none;
    width:38px;
    height:38px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    cursor:pointer;
    align-items:center;
    justify-content:center;
  }

  .menu-toggle span,
  .menu-toggle span::before,
  .menu-toggle span::after{
    content:"";
    display:block;
    width:18px;
    height:2px;
    background:var(--navy);
    position:relative;
    transition:transform .2s ease,opacity .2s ease;
  }

  .menu-toggle span::before{
    position:absolute;
    top:-6px;
  }

  .menu-toggle span::after{
    position:absolute;
    top:6px;
  }

  #nav-check{
    display:none;
  }

  @media(min-width:1000px){
    .menu-toggle{
      display:none;
    }
  }

  @media(max-width:999px){

    .nav-row{
      flex-wrap:wrap;
    }

    nav.primary{
      order:3;
      flex-basis:100%;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:0;
      max-height:0;
      overflow:hidden;
      transition:max-height .25s ease;
      width:100%;
    }

    nav.primary a{
      width:100%;
      padding:12px 4px;
      border-bottom:1px solid var(--line);
    }

    nav.primary a:hover,
    nav.primary a.active{
      background:var(--cream);
    }

    #nav-check:checked ~ .nav-row nav.primary{
      max-height:480px;
    }

    .menu-toggle{
      display:flex;
    }

    #nav-check:checked ~ .nav-row .menu-toggle span{
      background:transparent;
    }

    #nav-check:checked ~ .nav-row .menu-toggle span::before{
      transform:rotate(45deg);
      top:0;
    }

    #nav-check:checked ~ .nav-row .menu-toggle span::after{
      transform:rotate(-45deg);
      top:0;
    }

    .nav-cta{
      padding:9px 14px;
      font-size:0.8rem;
    }
  }

  @media(max-width:480px){
    .nav-cta span.long{
      display:none;
    }
  }

  /* CLIENT RESULTS PAGE */

  .results-head{
    background:#F6F1EA;
    padding:64px 0 48px;
    text-align:center;
  }

  .results-head h1{
    font-size:clamp(2rem,5vw,2.8rem);
    letter-spacing:-.015em;
    position:relative;
    padding-bottom:16px;
    display:inline-block;
  }

  .results-head h1::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:56px;
    height:3px;
    background:#B26126;
  }

  .results-head p{
    font-family:'Lora',Georgia,serif;
    font-size:1.08rem;
    color:var(--ink);
    max-width:56ch;
    margin:18px auto 0;
    line-height:1.7;
  }

  .results-list{
    background:#F6F1EA;
    padding:0 0 72px;
  }

  .results-list .wrap{
    max-width:860px;
    display:grid;
    gap:32px;
  }

  .result-card{
    background:#FFFCF8;
    border:1px solid #ddc9a8;
    border-left:4px solid #B26126;
    border-radius:8px;
    padding:40px 44px;
    box-shadow:0 20px 44px -32px rgba(10,16,68,.3);
    margin:0;
    scroll-margin-top:110px;
  }

  .result-card .mark{
    font-family:'Playfair Display',serif;
    font-size:2.4rem;
    color:var(--navy);
    line-height:1;
    margin-bottom:8px;
  }

  .result-card blockquote{
    margin:0;
  }

  .result-card p{
    font-family:'Lora',Georgia,serif;
    font-size:1.08rem;
    line-height:1.75;
    color:var(--ink);
    margin:0 0 18px;
  }

  .result-card figcaption{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid #e2d6c4;
    font-size:0.82rem;
    color:var(--ink-soft);
    font-weight:600;
  }

  .result-card figcaption strong{
    display:block;
    color:var(--navy);
    font-weight:700;
    font-size:0.92rem;
  }

  .results-cta{
    background:var(--navy-deep);
    color:#fff;
    padding:52px 0;
    text-align:center;
  }

  .results-cta h2{
    color:#fff;
    font-size:clamp(1.4rem,3.6vw,1.8rem);
  }

  .results-cta p{
    color:rgba(255,255,255,.82);
    margin:12px auto 24px;
    max-width:52ch;
    font-size:0.95rem;
  }

  .results-cta .actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
  }

  .results-cta .btn-outline{
    color:#fff;
    border-color:rgba(255,255,255,.6);
  }

  .results-cta
